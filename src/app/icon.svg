<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Credify mark: a five-step meter in the five risk-grade colours, rising from Very
    High to Low. Same idea as the wordmark in components/layout/logo.tsx, drawn with literal
    hex values because a favicon renders outside the page and cannot read the design tokens
    from globals.css.
  -->
  <rect width="32" height="32" rx="6" fill="#0e4c5a"/>
  <rect x="4.6"  y="20"   width="3.6" height="6"    rx="1" fill="#a3302b"/>
  <rect x="9.6"  y="16.5" width="3.6" height="9.5"  rx="1" fill="#c25b28"/>
  <rect x="14.6" y="13"   width="3.6" height="13"   rx="1" fill="#b8861b"/>
  <rect x="19.6" y="9.5"  width="3.6" height="16.5" rx="1" fill="#6f8f2e"/>
  <rect x="24.6" y="6"    width="3.6" height="20"   rx="1" fill="#2e7d4f"/>
</svg>
